<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid-area</title>
    <link rel="stylesheet" href="Grid-area.css">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }
        body{
            width: 100%;
            height: 100%;
        }
        .cont{
            display: grid;
            gap: 1rem;
            background-color: rgb(33, 33, 38);
            padding: 4rem;
            grid-template-areas: 
            "header header header"
            "SideBar Content-1 Content-1"
            "SideBar Content-2 Content-3"
            "Footer Footer Footer";
        }
        .item{
            background-color: rgb(13, 13, 209);
            border: 2px solid black;
            padding: 1rem;
            color: aliceblue;
        }
        #header{
            grid-area: header;
        }
         #SideBar{
            grid-area: SideBar;
        }
         #Content-1{
             grid-area: Content-1;
        }
         #Content-2{
             grid-area:Content-2;
        }
         #Content-3{
             grid-area: Content-3;
        }
         #Footer{
             grid-area: Footer;
        }
    </style>
</head>
<body>
    <div class="cont">
        <div class="item" id="header">Header</div>
        <div class="item" id="SideBar">SideBar</div>
        <div class="item" id="Content-1">Content-1</div>
        <div class="item" id="Content-2">Content-2</div>
        <div class="item" id="Content-3">Content-3</div>
        <div class="item" id="Footer">Footer</div>
    </div>
</body>
</html>
